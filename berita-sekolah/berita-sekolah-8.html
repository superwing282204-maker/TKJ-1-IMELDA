<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenangan Renang Kelas X - TKJ 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="../images/logo.png">
<style>
  /* =====================================================
     PANDUAN EDIT CEPAT
     - File ini punya 2 bagian: TENTANG KAMI (atas) dan
       FOOTER (bawah).
     - Bagian "Tentang Kami" diatur dari ABOUT_CONFIG.
     - Bagian "Footer" diatur dari FOOTER_CONFIG.
       Keduanya ada di bagian bawah file ini (dekat </body>).
     - Cukup ubah nilai di dalam config masing-masing,
       JANGAN ubah bagian <section>/<footer> di HTML karena
       itu cetakan kosong yang diisi otomatis oleh script.
     - Warna tema bisa diubah lewat variabel CSS di :root.
  ===================================================== */

  :root{
    --brand-dark: #143745;     /* teal gelap, warna utama tema situs */
    --brand-dark-soft: #1c4657;
    --brand-darkest: #0F2A34;
    --accent: #FFD400;         /* warna aksen tombol / judul */
    --accent-text: #1A1A1A;
    --bg-panel: #F4F6F5;
    --text-heading: #12262C;
    --text-body: #45575A;
    --text-main: #EAF2F1;
    --text-muted: #A9C0BE;
    --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family: var(--font-body); background:#fff; }

  /* ============ BAGIAN 1: TENTANG KAMI ============ */
  .about-topbar{ height: 10px; background: var(--brand-dark); }

  .back-bar{
    background: var(--bg-panel);
    padding: 14px clamp(20px, 5vw, 64px);
  }
  .back-btn{
    display:inline-flex; align-items:center; gap:8px;
    font-family: var(--font-body); font-weight:600; font-size:0.9rem;
    color: var(--brand-dark); text-decoration:none;
  }
  .back-btn svg{ width:16px; height:16px; }
  .back-btn:hover{ text-decoration: underline; }

  .about{
    display:grid;
    grid-template-columns: 1fr 1fr;
    min-height: 340px;
  }
  @media (max-width: 800px){ .about{ grid-template-columns: 1fr; } }

  .about__media{
    position:relative; overflow:hidden; background: var(--bg-panel);
    display:flex; align-items:center; justify-content:center;
    padding: clamp(20px, 4vw, 48px);
  }
  .about__media img{
    width:100%; height:100%;
    max-height: 380px;
    object-fit: cover;
    border-radius: var(--radius);
    display:block;
  }
  @media (max-width: 800px){
    .about__media img{ max-height: 260px; }
  }
  @media (max-width: 420px){
    .about__media img{ max-height: 200px; }
  }

  .about__content{
    background: var(--bg-panel);
    display:flex; flex-direction:column; justify-content:center; gap: 18px;
    padding: clamp(32px, 6vw, 72px);
  }
  .about__eyebrow{
    font-family: var(--font-display); font-size: 0.78rem;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand-dark);
  }
  .about__title{
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(1.6rem, 3vw, 2.4rem); color: var(--text-heading); line-height:1.2;
  }
  .about__text{ font-size: 1rem; line-height: 1.7; color: var(--text-body); max-width: 55ch; }

  .about__gallery{ margin-top: 10px; }
  .about__gallery h4{
    font-family: var(--font-display); color: var(--brand-dark);
    font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px;
  }
  .about__gallery-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 55ch; }
  @media (max-width: 420px){ .about__gallery-grid{ gap: 8px; } }
  .about__gallery-item{
    position:relative; border-radius: var(--radius); overflow:hidden;
    aspect-ratio: 4/3; background: var(--bg-panel);
  }
  .about__gallery-item img{ width:100%; height:100%; object-fit:cover; display:block; transition: transform .3s ease; }
  .about__gallery-item:hover img{ transform: scale(1.06); }
  .about__gallery-cap{
    position:absolute; left:0; right:0; bottom:0;
    padding: 6px 8px; font-size:0.7rem; color:#fff;
    background: linear-gradient(to top, rgba(0,0,0,0.65), transparent);
  }
  @media (max-width: 420px){ .about__gallery-cap{ display:none; } }

  /* ============ BAGIAN 2: FOOTER ============ */
  .footer{
    background: var(--brand-dark);
    color: var(--text-main);
    padding: clamp(32px, 5vw, 56px) clamp(20px, 5vw, 64px) 0;
  }
  .footer__inner{ max-width: 1200px; margin: 0 auto; }

  .footer__grid{
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 32px 24px;
  }
  @media (max-width: 640px){ .footer__grid{ grid-template-columns: 1fr; } }

  .footer__brand{ display:flex; flex-direction:column; gap:14px; }
  .footer__logo{ display:flex; align-items:center; gap:10px; }
  .footer__logo img{ width:34px; height:34px; object-fit:contain; border-radius:6px; }
  .footer__logo span{ font-family: var(--font-display); font-weight:700; font-size: 1.3rem; letter-spacing:0.02em; }
  .footer__desc{ color: var(--text-muted); font-size:0.92rem; line-height:1.6; max-width: 32ch; }

  .footer__social{ display:flex; gap:10px; margin-top:4px; }
  .footer__social a{
    width:36px; height:36px; border-radius:50%; background: var(--brand-dark-soft);
    display:flex; align-items:center; justify-content:center; transition: background .15s ease;
  }
  .footer__social a:hover{ background: var(--accent); }
  .footer__social svg{ width:16px; height:16px; fill: var(--text-main); }
  .footer__social a:hover svg{ fill:#143745; }

  .footer__col h4{
    font-family: var(--font-display); color: var(--accent);
    font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 16px;
  }
  .footer__col ul{ list-style:none; display:flex; flex-direction:column; gap:10px; }
  .footer__col a{ color: var(--text-muted); text-decoration:none; font-size:0.92rem; transition: color .15s ease; }
  .footer__col a:hover{ color: var(--text-main); }
  .footer__col p{ color: var(--text-muted); font-size:0.92rem; line-height:1.7; margin-bottom: 4px; }

  .footer__contact li{ color: var(--text-muted); font-size:0.9rem; line-height:1.6; display:flex; gap:8px; }
  .footer__contact li span.ico{ color: var(--accent); flex-shrink:0; }

  .footer__bottom{
    margin-top: clamp(28px, 5vw, 44px);
    background: var(--brand-darkest);
    display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; justify-content:space-between;
    padding: 16px 20px; font-size: 0.85rem; color: var(--text-muted);
  }
  .footer__bottom a{ color: var(--accent); text-decoration:none; }
  .footer__bottom-links{ display:flex; gap:16px; flex-wrap:wrap; }
  @media (max-width: 480px){
    .footer__bottom{ justify-content:center; text-align:center; }
  }
</style>
</head>
<body>

<!-- ============ BAGIAN 1: TENTANG KAMI ============ -->
<div class="about-topbar"></div>

<div class="back-bar">
  <a class="back-btn" id="a-back" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    <span id="a-back-text"></span>
  </a>
</div>

<section class="about" id="about-section">
  <div class="about__media">
    <img id="a-image" src="" alt="">
  </div>
  <div class="about__content">
    <span class="about__eyebrow" id="a-eyebrow"></span>
    <h2 class="about__title" id="a-title"></h2>
    <p class="about__text" id="a-text"></p>

    <div class="about__gallery">
      <h4 id="a-gallery-title"></h4>
      <div class="about__gallery-grid" id="a-gallery-grid"></div>
    </div>
  </div>
</section>

<!-- ============ BAGIAN 2: FOOTER ============ -->
<footer class="footer" id="site-footer">
  <div class="footer__inner">

    <div class="footer__grid">
      <div class="footer__brand">
        <div class="footer__logo">
          <img id="f-logo" src="" alt="Logo">
          <span id="f-brand"></span>
        </div>
        <p class="footer__desc" id="f-desc"></p>
        <div class="footer__social" id="f-social"></div>
      </div>

      <div class="footer__col">
        <h4 id="f-col3-title"></h4>
        <ul class="footer__contact" id="f-col3-list"></ul>
      </div>
    </div>

  </div>

  <div class="footer__bottom" id="f-bottom-wrap">
    <span id="f-bottom"></span>
    <div class="footer__bottom-links" id="f-bottom-links"></div>
  </div>
</footer>

<script>
/* =====================================================
   ABOUT_CONFIG — EDIT DI SINI SAJA
===================================================== */
const ABOUT_CONFIG = {
  backButton: {
    text: "Kembali",
    href: "../index.html" // ganti dengan halaman tujuan, misalnya "index.html" atau "berita.html"
  },

  image: {
    src: "../images/kolamdeli1.jpeg", // ganti dengan foto asli renang di Kolam Deli saat kelas X
    alt: "Kenangan renang bersama kelas X TKJ 1 di Kolam Deli"
  },
  eyebrow: "Tentang Kami",
  title: "Kenangan Renang Saat Kelas X",
  text: "Jauh sebelum menjadi kelas XI, kebersamaan siswa-siswi TKJ 1 sudah terjalin sejak masih duduk di bangku kelas X. Salah satu kenangan paling berkesan adalah saat rombongan kelas berenang bersama di Kolam Deli. Diiringi tawa dan candaan khas anak SMK, momen ini menjadi salah satu cerita hangat yang selalu diingat hingga sekarang. Dari sinilah benih kekompakan kelas mulai tumbuh, jauh sebelum berbagai kegiatan seru lain menyusul di tahun-tahun berikutnya.",
  // 3 foto acak — TINGGAL GANTI "src" dengan path/URL foto kamu sendiri
  gallery: {
    title: "Galeri Kenangan",
    photos: [
      { src: "../images/kolamdeli2.jpeg", alt: "Kenangan renang 1", caption: "Renang di Kolam Deli" },
      { src: "../images/kolamdeli3.jpeg", alt: "Kenangan renang 2", caption: "Kelas X TKJ 1" },
      { src: "../images/kolamdeli1.jpeg", alt: "Kenangan renang 3", caption: "Foto Kenangan" }
    ]
  }
};

/* =====================================================
   FOOTER_CONFIG — EDIT DI SINI SAJA
===================================================== */
const FOOTER_CONFIG = {
  logo: "../images/logo.png", // ganti dengan path logo TKJ 1 kamu
  brand: "TKJ 1",
  desc: "SMK Imelda Medan — Teknik Komputer dan Jaringan. Dokumentasi kegiatan, informasi kelas, dan galeri kelas XI TKJ 1.",

  social: [
    { icon: "instagram", href: "https://instagram.com/elevenclass_tkjone" },
    { icon: "facebook",  href: "https://facebook.com/smkimeldamedan" },
    { icon: "tiktok",    href: "https://tiktok.com/@smkkesehatanimeldamedan" }
  ],

  col3: {
    title: "Kontak",
    items: [
      { icon: "📍", text: "Jl. Bilal No. 48, Pulo Brayan Darat I, Medan Timur" },
      { icon: "✉️", text: "tkj1.smkimelda@gmail.com" },
      { icon: "📞", text: "(061) 000-0000" }
    ]
  },

  bottomText: "© 2026 TKJ 1 SMK Imelda Medan — Dibuat oleh siswa TKJ 1",
  bottomLinks: [
    { text: "Kontak", href: "kontak.html" },
    { text: "Tentang", href: "tentang.html" }
  ]
};

/* =====================================================
   Jangan perlu diedit — bagian ini otomatis merender
   ABOUT_CONFIG & FOOTER_CONFIG ke dalam HTML di atas.
===================================================== */

// -- Render Tentang Kami --
document.getElementById('a-back').href = ABOUT_CONFIG.backButton.href;
document.getElementById('a-back-text').textContent = ABOUT_CONFIG.backButton.text;
document.getElementById('a-image').src = ABOUT_CONFIG.image.src;
document.getElementById('a-image').alt = ABOUT_CONFIG.image.alt;
document.getElementById('a-eyebrow').textContent = ABOUT_CONFIG.eyebrow;
document.getElementById('a-title').textContent = ABOUT_CONFIG.title;
document.getElementById('a-text').textContent = ABOUT_CONFIG.text;

document.getElementById('a-gallery-title').textContent = ABOUT_CONFIG.gallery.title;
document.getElementById('a-gallery-grid').innerHTML = ABOUT_CONFIG.gallery.photos.map(p => `
  <div class="about__gallery-item">
    <img src="${p.src}" alt="${p.alt}">
    <div class="about__gallery-cap">${p.caption}</div>
  </div>
`).join('');

// -- Render Footer --
const ICONS = {
  instagram: '<svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.07 3.3.15 4.8 1.7 5 5C22 8.5 22 8.9 22 12.1s0 3.6-.07 4.9c-.15 3.3-1.7 4.8-5 5C15.6 22 15.2 22 12 22s-3.6 0-4.9-.07c-3.3-.15-4.8-1.7-5-5C2 15.7 2 15.3 2 12.1s0-3.6.07-4.9c.15-3.3 1.7-4.8 5-5C8.4 2.2 8.8 2.2 12 2.2zm0 3.3a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2zm0 2a4.6 4.6 0 1 1 0 9.2 4.6 4.6 0 0 1 0-9.2zm6.9-.4a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/></svg>',
  facebook: '<svg viewBox="0 0 24 24"><path d="M13.5 22v-8.4h2.8l.4-3.3h-3.2V8c0-.96.27-1.6 1.66-1.6H17V3.4A22 22 0 0 0 14.7 3.3c-2.3 0-3.9 1.4-3.9 4v2.3H8v3.3h2.8V22h2.7z"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24"><path d="M16.6 2h-3.2v13.4a2.7 2.7 0 1 1-2.1-2.6V9.6a6 6 0 1 0 5.3 5.95V9.1a7.6 7.6 0 0 0 4.4 1.4V7.3c-2-.1-3.7-1.5-4.4-3.4V2z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24"><path d="M21.6 7.2s-.2-1.5-.85-2.15c-.8-.85-1.7-.85-2.1-.9C15.9 4 12 4 12 4s-3.9 0-6.65.15c-.4.05-1.3.05-2.1.9C2.6 5.7 2.4 7.2 2.4 7.2S2.2 9 2.2 10.7v1.6c0 1.7.2 3.5.2 3.5s.2 1.5.85 2.15c.8.85 1.85.82 2.3.9C7.1 19 12 19 12 19s3.9 0 6.65-.15c.4-.05 1.3-.05 2.1-.9.65-.65.85-2.15.85-2.15s.2-1.8.2-3.5v-1.6c0-1.7-.2-3.5-.2-3.5zM9.9 14.6V8.9l5.4 2.85z"/></svg>',
  whatsapp: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.35A10 10 0 1 0 12 2zm0 18.2a8.15 8.15 0 0 1-4.16-1.14l-.3-.18-3.1.82.83-3-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.25-.13-1.47-.72-1.7-.8-.23-.09-.4-.13-.56.13-.17.25-.65.8-.8.96-.15.17-.3.19-.55.06-.25-.13-1.06-.39-2-1.24-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.3.37-.44.13-.15.17-.25.25-.42.08-.17.04-.3-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.43h-.48c-.17 0-.44.06-.67.3-.23.25-.87.85-.87 2.1s.9 2.44 1.02 2.6c.13.17 1.77 2.7 4.28 3.78.6.26 1.06.41 1.43.53.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.2-.58.2-1.08.14-1.18-.06-.1-.23-.17-.48-.3z"/></svg>'
};

document.getElementById('f-logo').src = FOOTER_CONFIG.logo;
document.getElementById('f-brand').textContent = FOOTER_CONFIG.brand;
document.getElementById('f-desc').textContent = FOOTER_CONFIG.desc;

document.getElementById('f-social').innerHTML = FOOTER_CONFIG.social.map(s =>
  `<a href="${s.href}" target="_blank" rel="noopener" aria-label="${s.icon}">${ICONS[s.icon] || ''}</a>`
).join('');

document.getElementById('f-col3-title').textContent = FOOTER_CONFIG.col3.title;

document.getElementById('f-col3-list').innerHTML = FOOTER_CONFIG.col3.items.map(i =>
  `<li><span class="ico">${i.icon}</span><span>${i.text}</span></li>`
).join('');

document.getElementById('f-bottom').innerHTML = FOOTER_CONFIG.bottomText;
document.getElementById('f-bottom-links').innerHTML = FOOTER_CONFIG.bottomLinks.map(l =>
  `<a href="${l.href}">${l.text}</a>`
).join('');
</script>

</body>
</html>
