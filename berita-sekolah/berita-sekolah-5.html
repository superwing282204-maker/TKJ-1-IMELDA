<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">Renang Bulanan - TKJ 1</title>
<link rel="shortcut icon" href="../images/logo.png">
<style>
  :root{
    --brand-dark:#143745;
    --brand-dark2:#0d2732;
    --brand-teal:#1e5f6e;
    --brand-green:#2ECC71;
    --text-dark:#464646;
    --border-color:#e5e5e5;
    --bg-light:#f5f5f5;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:"Work Sans", Arial, sans-serif;
    color:var(--text-dark);
    background:#eee;
    overflow-x:hidden;
  }
  a{color:var(--brand-dark); text-decoration:none;}
  a:hover{text-decoration:underline;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  .topbar{
    background:var(--brand-dark);
    color:#fff;
    font-size:13px;
    padding:6px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:4px 10px;
    justify-content:space-between;
    align-items:center;
  }
  .topbar .social a{color:#fff; margin-left:10px; transition:color .2s;}
  .topbar .social a:hover{color:var(--brand-green); text-decoration:none;}

  header.site-header{
    background:#fff;
    padding:20px;
    text-align:center;
    border-bottom:3px solid var(--brand-dark);
    position:relative;
    overflow:hidden;
  }
  header.site-header img.logo{
    width:80px; height:80px; object-fit:contain;
    vertical-align:middle; margin-right:10px;
  }
  header.site-header .brand-text{
    display:inline-block; vertical-align:middle; text-align:left;
  }
  header.site-header h1.site-title{
    margin:0; font-size:clamp(19px, 4.5vw, 28px); color:var(--brand-dark);
  }
  header.site-header p.site-desc{
    margin:0; font-size:clamp(11px, 2vw, 13px); color:#777;
  }

  nav.main-nav{
    background:#222;
    position:sticky; top:0; z-index:50;
  }
  nav.main-nav ul{
    list-style:none; margin:0; padding:0;
    display:flex; flex-wrap:wrap; justify-content:center;
  }
  nav.main-nav li{position:relative;}
  nav.main-nav a{
    display:block; padding:14px 18px; color:#fff; font-size:14px;
    transition:background .25s, letter-spacing .25s;
  }
  nav.main-nav a:hover{background:var(--brand-green); text-decoration:none; letter-spacing:.5px;}

  .wrapper{
    max-width:900px; margin:20px auto; padding:0 15px;
  }

  .article-box{background:#fff; padding:20px; border-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .category-tags a{
    display:inline-block; background:var(--brand-dark); color:#fff;
    font-size:11px; padding:4px 10px; border-radius:3px; margin-right:5px; margin-bottom:8px;
    transition:background .2s;
  }
  .category-tags a:hover{background:var(--brand-teal); text-decoration:none;}
  .article-box h2.title{
    font-size:clamp(20px, 4vw, 26px); margin:5px 0 10px; color:#222; line-height:1.3; word-wrap:break-word;
  }
  .meta-date{
    font-size:13px; color:#999; margin-bottom:15px;
  }
  .featured-image{
    width:100%; aspect-ratio:16/9;
    background:var(--bg-light);
    display:flex; align-items:center; justify-content:center;
    color:#aaa; font-size:14px; border:1px dashed #ccc; margin-bottom:20px;
    overflow:hidden; border-radius:6px;
  }
  .featured-image img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  article p{
    text-align:justify; line-height:1.8; margin-bottom:14px;
  }
  article ol, article ul{margin-bottom:14px; line-height:1.7;}
  .highlight-box{
    background:var(--brand-green); border-left:4px solid var(--brand-dark);
    padding:12px 16px; margin:16px 0; font-weight:bold; color:#333;
    border-radius:2px;
  }
  .section-divider{
    display:flex; align-items:center; gap:10px; margin:22px 0 14px; color:var(--brand-dark);
    font-size:13px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  }
  .section-divider::before, .section-divider::after{
    content:""; flex:1; height:2px; background:var(--border-color);
  }

  table.data-table{
    width:100%; border-collapse:collapse; margin:15px 0;
  }
  table.data-table th, table.data-table td{
    border:1px solid var(--border-color); padding:8px 10px; font-size:14px;
  }
  table.data-table th{background:var(--brand-dark); color:#fff; text-align:left;}
  table.data-table tr:nth-child(even){background:#fafafa;}
  table.data-table tbody tr:hover{background:#eafaf0;}

  .share-row{margin-top:20px; padding-top:15px; border-top:1px solid var(--border-color);}
  .share-row a{
    display:inline-block; width:34px; height:34px; line-height:34px; text-align:center;
    background:var(--brand-dark); color:#fff; border-radius:50%; margin-right:6px; font-size:14px;
    transition:transform .2s, background .2s;
  }
  .share-row a:hover{background:var(--brand-green); transform:translateY(-3px); text-decoration:none;}

  .author-box{
    display:flex; align-items:center; gap:12px; margin-top:20px;
    background:#fff; padding:15px 20px; border-radius:4px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  .author-box .avatar{
    width:50px; height:50px; border-radius:50%; background:var(--bg-light);
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#aaa;
    overflow:hidden;
  }

  .related-box{background:#fff; padding:20px; border-radius:4px; margin-top:20px; box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .related-box h3{margin-top:0; border-bottom:2px solid var(--brand-green); padding-bottom:8px;}
  .related-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:15px;}
  @media (max-width:800px){.related-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:480px){.related-grid{grid-template-columns:1fr;}}
  .related-card{
    background:var(--bg-light); border-radius:4px; overflow:hidden;
  }
  .related-card .thumb{
    aspect-ratio:16/9; background:#e0e0e0; display:flex; align-items:center;
    justify-content:center; color:#aaa; font-size:12px; overflow:hidden;
  }
  .related-card .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .related-card .content{padding:10px;}
  .related-card .content h4{font-size:14px; margin:0 0 6px;}
  .related-card .content .date{font-size:11px; color:#999;}

  footer{
    background:var(--brand-dark); color:#fff; text-align:center; padding:25px 15px; margin-top:30px;
  }
  footer h1.site-title{font-size:22px; margin:8px 0 0;}
  footer p{font-size:13px; opacity:.85;}
  footer .copy{font-size:12px; opacity:.7; margin-top:15px;}

  .back-to-top{
    position:fixed; right:18px; bottom:18px;
    width:44px; height:44px; border-radius:50%;
    background:var(--brand-dark); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; box-shadow:0 4px 14px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transform:translateY(10px);
    transition:opacity .3s, transform .3s, background .3s;
    z-index:60;
  }
  .back-to-top.show{opacity:1; pointer-events:auto; transform:translateY(0);}
  .back-to-top:hover{background:var(--brand-green); text-decoration:none;}

  @media (min-width:601px) and (max-width:900px){
    .wrapper{max-width:100%; padding:0 20px;}
  }

  @media (max-width:600px){
    .topbar{font-size:11px; padding:6px 12px;}
    header.site-header{padding:14px 10px;}
    header.site-header img.logo{width:56px; height:56px; margin-right:6px;}
    nav.main-nav a{padding:10px 12px; font-size:13px;}
    .wrapper{margin:12px auto; padding:0 10px;}
    .article-box{padding:14px;}
    article p{text-align:left; line-height:1.75; font-size:14.5px;}
    .related-grid{gap:10px;}
    table.data-table th, table.data-table td{font-size:12.5px; padding:6px 7px;}
    .author-box{padding:12px 14px; flex-wrap:wrap;}
    .back-to-top{width:40px; height:40px; right:12px; bottom:12px;}
  }
</style>
</head>
<body>

  <div class="topbar">
    <span id="tanggalTop"></span>
    <span class="social">   </span>
  </div>

  <header class="site-header">
      <img class="logo" src="../images/logo.png" alt="TKJ 1 - SMK IMELDA">
      <div class="brand-text">
      <h1 class="site-title">TKJ 1 - SMK IMELDA</h1>
      <p class="site-desc" id="siteDesc"></p>
    </div>
  </header>

  <nav class="main-nav">
    <ul>
      <a href="../index.html" class="btn-back">&larr; Kembali</a>
    </ul>
  </nav>

  <div class="wrapper">
    <main>
      <div class="article-box">

        <div class="category-tags" id="categoryTags"></div>

        <h2 class="title" id="judulCerita"></h2>
        <div class="meta-date" id="tanggalMeta"></div>

        <div class="featured-image">
          <img id="fotoUtama" src="" alt="Foto utama" loading="lazy">
        </div>

        <article id="isiCerita">
          <!-- diisi otomatis dari config.sections -->
        </article>

      </div>

      <div class="author-box">
        <div class="avatar">
          <img src="../images/logo.png" alt="notulis">
        </div>
        <strong id="notulisText"></strong>
      </div>

      <div class="related-box">
        <h3>Foto Terkait</h3>
        <div class="related-grid" id="gridFotoTerkait">
          <!-- diisi otomatis dari config.fotoTerkait -->
        </div>
      </div>
    </main>
  </div>

  <footer>
    <img class="logo" src="../images/logo.png" alt="TKJ 1 - SMK IMELDA" style="width:70px;height:70px;object-fit:contain;">
    <h1 class="site-title">TKJ 1 - SMK IMELDA</h1>
    <p></p>
    <div class="copy" id="copyFooter"></div>
  </footer>

  <a href="#top" class="back-to-top" id="backToTop" aria-label="Kembali ke atas">&uarr;</a>

  <script>
    // =====================================================================
    //  TEMPLATE CERITA — TINGGAL GANTI ISI "config" DI BAWAH INI.
    //  Semua yang tampil di halaman (judul, cerita, peserta, foto,
    //  footer) diambil dari sini. TIDAK PERLU sentuh HTML di atas
    //  untuk mengganti isi cerita berikutnya.
    // =====================================================================
    const config = {

      // --- Info dasar ---
      tanggal: "5 Juli 2025",       // GANTI: tanggal kegiatan (dipakai di 2 tempat)
      judulTab: "Renang Bulanan - TKJ 1",
      deskripsiKecil: "Agenda Renang Bulanan Sekelas",
      judulCerita: "Renang Bulanan di Kolam Renang Unimed",
      tags: ["RENANG", "UNIMED", "AGENDA BULANAN"],
      fotoUtama: "../images/fot65.jpeg",      // GANTI: foto utama di atas cerita

      // --- Isi cerita ---
      // Tiap objek = satu bagian cerita dengan judul kecil + beberapa paragraf.
      // Tambah atau hapus objek sesuai jumlah bagian yang kamu mau.
      sections: [
        {
          judul: "Awal Mula Tradisi",
          paragraf: [
            "Berawal dari keinginan untuk melepas penat setelah rutinitas sekolah, kami sekelas sepakat membuat agenda renang bareng yang dilaksanakan setiap bulan. Tujuannya sederhana, supaya kekompakan kelas tetap terjaga di luar jam pelajaran.",
            "Setelah berdiskusi, akhirnya kolam renang Unimed (Universitas Negeri Medan) dipilih jadi lokasi rutin, karena tempatnya bersih, luas, dan mudah dijangkau oleh anak-anak sekelas."
          ]
        },
        {
          judul: "Rutin Setiap Bulan",
          paragraf: [
            "Sejak saat itu, renang bareng di kolam renang Unimed jadi agenda bulanan yang selalu dinanti-nanti. Setiap bulan, kami sekelas menyempatkan waktu untuk kumpul dan berenang bersama, biasanya di akhir pekan supaya tidak mengganggu jadwal sekolah.",
            "Harga masuk kolam renangnya juga cukup terjangkau, yaitu 25 ribu rupiah per orang, jadi nggak terlalu memberatkan buat anak sekolah seperti kami."
          ]
        },
        {
          judul: "Keseruan di Kolam Renang",
          paragraf: [
            "Setiap kali agenda renang bulanan ini berlangsung, suasana selalu ramai dan seru. Ada yang lomba renang kecil-kecilan, ada yang cuma santai berendam sambil ngobrol, dan ada juga yang sibuk foto-foto buat kenangan.",
            "Momen basah-basahan bareng teman sekelas ini selalu berhasil menghilangkan penat dan bikin badan jadi lebih segar setelah seharian penuh dengan tugas dan pelajaran di sekolah."
          ]
        },
        {
          judul: "Kebersamaan Sekelas",
          paragraf: [
            "Lebih dari sekadar berenang, agenda bulanan ini jadi ajang buat mempererat kekompakan seluruh anak sekelas. Banyak cerita, candaan, dan momen kebersamaan yang tercipta setiap kali acara ini berlangsung.",
            "Nggak jarang juga, setelah puas berenang, kami lanjut istirahat sejenak sambil makan bersama sebelum akhirnya pulang ke rumah masing-masing."
          ]
        },
        {
          judul: "Rencana Bulan Berikutnya",
          paragraf: [
            "Karena selalu seru dan bikin nagih, agenda renang bulanan di kolam renang Unimed ini rencananya akan terus dilanjutkan setiap bulannya, selama nggak berbenturan dengan jadwal sekolah.",
            "Semoga tradisi renang bareng sekelas ini bisa terus berjalan dan jadi salah satu momen kebersamaan yang selalu dirindukan oleh seluruh anak kelas."
          ]
        }
      ],

      // Daftar kegiatan (list bernomor)
      daftarKegiatan: [
        "KUMPUL DAN BERANGKAT BERSAMA KE UNIMED",
        "MEMBAYAR TIKET MASUK KOLAM (25K/ORANG)",
        "BERENANG DAN BERMAIN AIR BERSAMA",
        "LOMBA RENANG KECIL-KECILAN",
        "SESI FOTO BERSAMA DI PINGGIR KOLAM",
        "ISTIRAHAT DAN MAKAN BERSAMA",
        "PULANG BERSAMA-SAMA"
      ],

      // Kotak catatan hijau di akhir cerita
      catatanPenutup: "Agenda renang bulanan di kolam renang Unimed ini menjadi momen yang selalu dinanti seluruh anak sekelas. Dengan harga yang terjangkau, yaitu 25 ribu rupiah per orang, kegiatan ini berhasil jadi cara sederhana untuk terus menjaga kekompakan kelas.",

      // Paragraf penutup setelah kotak catatan
      penutup: [
        "Terima kasih untuk semua teman sekelas yang selalu semangat ikut serta dalam agenda renang bulanan ini.",
        "Sampai jumpa di agenda renang bulan depan di kolam renang Unimed!"
      ],

      // --- Notulis / penulis cerita ---
      notulis: "NOTULIS : Nama Kamu",

      // --- Foto terkait di bagian bawah ---
      fotoTerkait: [
        { src: "../images/fot66.jpeg", judul: "Keseruan di Kolam Renang",  tanggal: "5 Juli 2025" },
        { src: "../images/fot64.jpeg", judul: "Foto Bersama Sekelas",      tanggal: "5 Juli 2025" },
        { src: "../images/fot65.jpeg", judul: "Kolam Renang Unimed",       tanggal: "5 Juli 2025" }
      ],

      // --- Footer ---
      tahunCopy: "2026"
    };

    // =====================================================================
    //  BAGIAN RENDER — TIDAK PERLU DIEDIT.
    //  Ini yang mengambil "config" di atas dan menampilkannya ke HTML.
    // =====================================================================

    document.getElementById('pageTitle').textContent = config.judulTab;
    document.getElementById('tanggalTop').textContent = config.tanggal;
    document.getElementById('siteDesc').textContent = config.deskripsiKecil;
    document.getElementById('judulCerita').textContent = config.judulCerita;
    document.getElementById('tanggalMeta').textContent = "📅 " + config.tanggal;
    document.getElementById('fotoUtama').src = config.fotoUtama;
    document.getElementById('fotoUtama').alt = config.judulCerita;
    document.getElementById('notulisText').textContent = config.notulis;
    document.getElementById('copyFooter').innerHTML = `&copy; TKJ 1 ${config.tahunCopy} | All Rights Reserved.`;

    // Catatan: tabel "Daftar yang ikut" sudah dihapus dari halaman ini,
    // jadi config.peserta tidak lagi digunakan / dirender.

    // Tags kategori
    const tagsEl = document.getElementById('categoryTags');
    config.tags.forEach(tag => {
      const a = document.createElement('a');
      a.href = '#' + tag;
      a.textContent = tag;
      tagsEl.appendChild(a);
    });

    // Isi cerita (sections + daftar kegiatan + catatan + penutup)
    const artikel = document.getElementById('isiCerita');
    let htmlCerita = '';
    config.sections.forEach(sec => {
      htmlCerita += `<div class="section-divider">${sec.judul}</div>`;
      sec.paragraf.forEach(p => {
        htmlCerita += `<p>${p}</p>`;
      });
    });
    htmlCerita += `<p>Daftar kegiatan:</p><ol>`;
    config.daftarKegiatan.forEach(item => {
      htmlCerita += `<li>${item}</li>`;
    });
    htmlCerita += `</ol>`;
    htmlCerita += `<div class="highlight-box"><p>Catatan: ${config.catatanPenutup}</p></div>`;
    config.penutup.forEach(p => {
      htmlCerita += `<p>${p}</p>`;
    });
    artikel.innerHTML = htmlCerita;

    // Kartu foto terkait
    const gridFoto = document.getElementById('gridFotoTerkait');
    config.fotoTerkait.forEach(foto => {
      const card = document.createElement('div');
      card.className = 'related-card';
      card.innerHTML = `
        <div class="thumb"><img src="${foto.src}" alt="${foto.judul}" loading="lazy"></div>
        <div class="content">
          <h4>${foto.judul}</h4>
          <div class="date">📅 ${foto.tanggal}</div>
        </div>`;
      gridFoto.appendChild(card);
    });

    // Back to top button
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', ()=>{
      if(window.scrollY > 300){
        backToTop.classList.add('show');
      } else {
        backToTop.classList.remove('show');
      }
    });
  </script>

</body>
</html>
