<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">Berita - TKJ 1</title>
<link rel="shortcut icon" href="images/logo.png">
<style>
  :root{
    --brand-dark:#143745;
    --brand-dark2:#0d2732;
    --brand-teal:#1e5f6e;
    --brand-green:#2ECC71;
    --text-dark:#464646;
    --border-color:#e5e5e5;
    --bg-light:#f5f5f5;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:"Work Sans", Arial, sans-serif;
    color:var(--text-dark);
    background:#eee;
    overflow-x:hidden;
  }
  a{color:var(--brand-dark); text-decoration:none;}
  a:hover{text-decoration:underline;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  .topbar{
    background:var(--brand-dark);
    color:#fff;
    font-size:13px;
    padding:6px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  header.site-header{
    background:#fff;
    padding:20px;
    text-align:center;
    border-bottom:3px solid var(--brand-dark);
  }
  header.site-header img.logo{
    width:80px; height:80px; object-fit:contain;
    vertical-align:middle; margin-right:10px;
  }
  header.site-header .brand-text{
    display:inline-block; vertical-align:middle; text-align:left;
  }
  header.site-header h1.site-title{
    margin:0; font-size:28px; color:var(--brand-dark);
  }
  header.site-header p.site-desc{
    margin:0; font-size:13px; color:#777;
  }

  nav.main-nav{
    background:#222;
    position:sticky; top:0; z-index:50;
  }
  nav.main-nav ul{
    list-style:none; margin:0; padding:0;
    display:flex; flex-wrap:wrap; justify-content:center;
  }
  nav.main-nav a{
    display:block; padding:14px 18px; color:#fff; font-size:14px;
    transition:background .25s, letter-spacing .25s;
  }
  nav.main-nav a:hover{background:var(--brand-green); text-decoration:none; letter-spacing:.5px;}

  .wrapper{
    max-width:900px; margin:20px auto; padding:0 15px;
  }

  .article-box{background:#fff; padding:20px; border-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .category-tags a{
    display:inline-block; background:var(--brand-dark); color:#fff;
    font-size:11px; padding:4px 10px; border-radius:3px; margin-right:5px; margin-bottom:8px;
    transition:background .2s;
  }
  .category-tags a:hover{background:var(--brand-teal); text-decoration:none;}
  .article-box h2.title{
    font-size:26px; margin:5px 0 10px; color:#222; line-height:1.3;
  }
  .meta-date{
    font-size:13px; color:#999; margin-bottom:15px;
  }
  .featured-image{
    width:100%; aspect-ratio:16/9;
    background:var(--bg-light);
    display:flex; align-items:center; justify-content:center;
    color:#aaa; font-size:14px; border:1px dashed #ccc; margin-bottom:20px;
    overflow:hidden; border-radius:6px;
  }
  .featured-image img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  article p{
    text-align:justify; line-height:1.8; margin-bottom:14px;
  }
  article ol, article ul{margin-bottom:14px; line-height:1.7;}
  .highlight-box{
    background:var(--brand-green); border-left:4px solid var(--brand-dark);
    padding:12px 16px; margin:16px 0; font-weight:bold; color:#333;
    border-radius:2px;
  }
  .section-divider{
    display:flex; align-items:center; gap:10px; margin:22px 0 14px; color:var(--brand-dark);
    font-size:13px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  }
  .section-divider::before, .section-divider::after{
    content:""; flex:1; height:2px; background:var(--border-color);
  }

  .share-row{margin-top:20px; padding-top:15px; border-top:1px solid var(--border-color);}

  .author-box{
    display:flex; align-items:center; gap:12px; margin-top:20px;
    background:#fff; padding:15px 20px; border-radius:4px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  .author-box .avatar{
    width:50px; height:50px; border-radius:50%; background:var(--bg-light);
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#aaa;
  }

  .related-box{background:#fff; padding:20px; border-radius:4px; margin-top:20px; box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .related-box h3{margin-top:0; border-bottom:2px solid var(--brand-green); padding-bottom:8px;}
  .related-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:15px;}
  @media (max-width:800px){.related-grid{grid-template-columns:1fr;}}
  .related-card{background:var(--bg-light); border-radius:4px; overflow:hidden;}
  .related-card .thumb{
    aspect-ratio:16/9; background:#e0e0e0; display:flex; align-items:center;
    justify-content:center; color:#aaa; font-size:12px; overflow:hidden;
  }
  .related-card .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .related-card .content{padding:10px;}
  .related-card .content h4{font-size:14px; margin:0 0 6px;}
  .related-card .content .date{font-size:11px; color:#999;}

  footer{
    background:var(--brand-dark); color:#fff; text-align:center; padding:25px 15px; margin-top:30px;
  }
  footer h1.site-title{font-size:22px; margin:8px 0 0;}
  footer p{font-size:13px; opacity:.85;}
  footer .copy{font-size:12px; opacity:.7; margin-top:15px;}

  .back-to-top{
    position:fixed; right:18px; bottom:18px;
    width:44px; height:44px; border-radius:50%;
    background:var(--brand-dark); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; box-shadow:0 4px 14px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transform:translateY(10px);
    transition:opacity .3s, transform .3s, background .3s;
    z-index:60;
  }
  .back-to-top.show{opacity:1; pointer-events:auto; transform:translateY(0);}
  .back-to-top:hover{background:var(--brand-green); text-decoration:none;}

  .status-box{
    text-align:center; padding:60px 20px; color:#888; font-size:15px;
  }
  .status-box .spinner{
    width:34px; height:34px; margin:0 auto 14px; border-radius:50%;
    border:3px solid var(--border-color); border-top-color:var(--brand-dark);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:600px){
    header.site-header{padding:14px 10px;}
    header.site-header img.logo{width:56px; height:56px; margin-right:6px;}
    header.site-header h1.site-title{font-size:19px;}
    header.site-header p.site-desc{font-size:11px;}
    nav.main-nav a{padding:10px 12px; font-size:13px;}
    .wrapper{margin:12px auto; padding:0 10px;}
    .article-box{padding:14px;}
    .article-box h2.title{font-size:20px;}
    article p{text-align:left; line-height:1.75; font-size:14.5px;}
    .related-grid{gap:10px;}
    .author-box{padding:12px 14px; flex-wrap:wrap;}
    .back-to-top{width:40px; height:40px; right:12px; bottom:12px;}
  }
</style>
</head>
<body>

  <div class="topbar">
    <span id="tanggalTop"></span>
    <span class="social"></span>
  </div>

  <header class="site-header">
    <img class="logo" src="images/logo.png" alt="TKJ 1 - SMK IMELDA">
    <div class="brand-text">
      <h1 class="site-title">TKJ 1 - SMK IMELDA</h1>
      <p class="site-desc" id="siteDesc">Berita Sekolah</p>
    </div>
  </header>

  <nav class="main-nav">
    <ul>
      <li><a href="index.html">&larr; Kembali ke Beranda</a></li>
    </ul>
  </nav>

  <div class="wrapper" id="wrapper">
    <!-- Ditampilkan sementara memuat data / kalau gagal -->
    <div class="status-box" id="statusBox">
      <div class="spinner"></div>
      <div>Memuat berita...</div>
    </div>

    <!-- Konten asli, disembunyikan sampai data siap -->
    <main id="mainContent" style="display:none;">
      <div class="article-box">
        <div class="category-tags" id="categoryTags"></div>
        <h2 class="title" id="judulCerita"></h2>
        <div class="meta-date" id="tanggalMeta"></div>
        <div class="featured-image">
          <img id="fotoUtama" src="" alt="">
        </div>

        <article id="isiCerita"></article>
      </div>

      <div class="author-box">
        <div class="avatar">TKJ 1</div>
        <div>
          <div id="notulisText" style="font-weight:600;"></div>
          <div style="font-size:12px; color:#999;">Circle TKJ 1 - SMK Imelda Medan</div>
        </div>
      </div>

      <div class="related-box" id="relatedBox" style="display:none;">
        <h3>Foto Terkait</h3>
        <div class="related-grid" id="gridFotoTerkait"></div>
      </div>
    </main>
  </div>

  <footer>
    <h1 class="site-title">TKJ 1 - SMK IMELDA</h1>
    <p>Circle TKJ 1</p>
    <p class="copy" id="copyFooter">&copy; TKJ 1 2026 | All Rights Reserved.</p>
  </footer>

  <div class="back-to-top" id="backToTop">&uarr;</div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="berita-db.js"></script>
  <script>
    // Ambil id berita dari URL, misalnya berita-template.html?id=-Nabc123
    const params = new URLSearchParams(window.location.search);
    const beritaId = params.get('id');

    const statusBox = document.getElementById('statusBox');
    const mainContent = document.getElementById('mainContent');

    function tampilkanError(pesan) {
      statusBox.innerHTML = `<div style="font-size:38px;">📭</div><div>${pesan}</div>
        <div style="margin-top:14px;"><a href="index.html">&larr; Kembali ke beranda</a></div>`;
    }

    function renderBerita(config) {
      document.getElementById('pageTitle').textContent = config.judulTab || config.judulCerita || 'Berita - TKJ 1';
      document.getElementById('tanggalTop').textContent = config.tanggal || '';
      document.getElementById('siteDesc').textContent = config.deskripsiKecil || 'Berita Sekolah';
      document.getElementById('judulCerita').textContent = config.judulCerita || '(Tanpa judul)';
      document.getElementById('tanggalMeta').textContent = config.tanggal ? ('📅 ' + config.tanggal) : '';
      if (config.fotoUtama) {
        document.getElementById('fotoUtama').src = config.fotoUtama;
        document.getElementById('fotoUtama').alt = config.judulCerita || '';
      }
      document.getElementById('notulisText').textContent = config.notulis || 'NOTULIS : Admin TKJ 1';
      document.getElementById('copyFooter').innerHTML = `&copy; TKJ 1 ${config.tahunCopy || '2026'} | All Rights Reserved.`;

      const tagsEl = document.getElementById('categoryTags');
      (config.tags || []).forEach(tag => {
        const a = document.createElement('a');
        a.href = 'index.html#' + tag;
        a.textContent = tag;
        tagsEl.appendChild(a);
      });

      const artikel = document.getElementById('isiCerita');
      let html = '';
      (config.sections || []).forEach(sec => {
        html += `<div class="section-divider">${sec.judul}</div>`;
        (sec.paragraf || []).forEach(p => { html += `<p>${p}</p>`; });
      });
      if (config.daftarKegiatan && config.daftarKegiatan.length) {
        html += `<p>Daftar kegiatan:</p><ol>`;
        config.daftarKegiatan.forEach(item => { html += `<li>${item}</li>`; });
        html += `</ol>`;
      }
      if (config.catatanPenutup) {
        html += `<div class="highlight-box"><p>Catatan: ${config.catatanPenutup}</p></div>`;
      }
      (config.penutup || []).forEach(p => { html += `<p>${p}</p>`; });
      artikel.innerHTML = html;

      const gridFoto = document.getElementById('gridFotoTerkait');
      if (config.fotoTerkait && config.fotoTerkait.length) {
        document.getElementById('relatedBox').style.display = '';
        config.fotoTerkait.forEach(foto => {
          const card = document.createElement('div');
          card.className = 'related-card';
          card.innerHTML = `
            <div class="thumb"><img src="${foto.src}" alt="${foto.judul}" loading="lazy"></div>
            <div class="content">
              <h4>${foto.judul}</h4>
              <div class="date">📅 ${foto.tanggal || ''}</div>
            </div>`;
          gridFoto.appendChild(card);
        });
      }

      statusBox.style.display = 'none';
      mainContent.style.display = '';
    }

    if (!beritaId) {
      tampilkanError('Berita tidak ditemukan (tidak ada id di alamat halaman).');
    } else {
      window.addEventListener('beritadb-ready', () => {
        window.BeritaDB.getBeritaById(beritaId, data => {
          if (!data) {
            tampilkanError('Berita tidak ditemukan. Mungkin sudah dihapus.');
          } else {
            renderBerita(data);
          }
        });
      });
    }

    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) backToTop.classList.add('show');
      else backToTop.classList.remove('show');
    });
    backToTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
  </script>
</body>
</html>
